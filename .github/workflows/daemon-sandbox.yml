name: Workspace daemon sandbox

on:
  push:
    branches: [main, develop]
    paths:
      - "src/httk/workflow/_daemon_*.py"
      - "src/httk/workflow/_sandbox.py"
      - "src/httk/workflow/_confine*.py"
      - "src/httk/workflow/_launch_*.py"
      - "src/httk/workflow/_manager_launches.py"
      - "tests/test_daemon_bootstrap.py"
      - "tests/test_daemon_policy.py"
      - "tests/test_daemon_sandbox.py"
      - "tests/test_confine_*.py"
      - "tests/test_launch_client.py"
      - "tests/test_launch_protocol.py"
      - "tests/test_manager_confinement.py"
      - "tests/test_manager_launches.py"
      - "tests/test_call_staging.py"
      - "tools/probe_daemon_mpi.c"
      - ".github/workflows/daemon-sandbox.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "src/httk/workflow/_daemon_*.py"
      - "src/httk/workflow/_sandbox.py"
      - "src/httk/workflow/_confine*.py"
      - "src/httk/workflow/_launch_*.py"
      - "src/httk/workflow/_manager_launches.py"
      - "tests/test_daemon_bootstrap.py"
      - "tests/test_daemon_policy.py"
      - "tests/test_daemon_sandbox.py"
      - "tests/test_confine_*.py"
      - "tests/test_launch_client.py"
      - "tests/test_launch_protocol.py"
      - "tests/test_manager_confinement.py"
      - "tests/test_manager_launches.py"
      - "tests/test_call_staging.py"
      - "tools/probe_daemon_mpi.c"
      - ".github/workflows/daemon-sandbox.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sandbox:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Bubblewrap and enable user namespaces on the isolated runner
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap openmpi-bin libopenmpi-dev
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Compile the site probe (running it as $HTTK_WORKFLOW_LAUNCH ./probe is a separate cluster acceptance check)
        run: mpicc -O2 -Wall -Wextra -Werror -o "$RUNNER_TEMP/httk-mpi-probe" tools/probe_daemon_mpi.c -lrt

      - name: Install trusted package and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Require the daemon broker and attempt confinement sandbox gates
        env:
          HTTK_REQUIRE_DAEMON_SANDBOX: "1"
          HTTK_TEST_PROFILE: extended
          PYTHONPATH: src
        run: >-
          python -m pytest -q -n 0
          tests/test_daemon_policy.py
          tests/test_daemon_bootstrap.py
          tests/test_daemon_sandbox.py
          tests/test_confine_settings.py
          tests/test_confine_sandbox.py
          tests/test_confine_rank.py
          tests/test_launch_protocol.py
          tests/test_launch_client.py
          tests/test_manager_confinement.py
          tests/test_manager_launches.py
          tests/test_call_staging.py
