[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "httk-workflow"
version = "0.1.0"
description = "Filesystem-native workflow execution for httk₂."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Rickard Armiento", email = "gitcommits@armiento.net" }]
dependencies = [
  "httk-core>=2.0.0,<3",
]
keywords = [
  "Materials Discovery",
  "Materials Informatics",
  "Materials Science",
  "Machine Learning",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Physics",
]

[project.urls]
Homepage = "https://httk.org"
Documentation = "https://docs.httk.org/httk-workflow/"
Repository = "https://github.com/httk/httk-workflow"
Issues = "https://github.com/httk/httk-workflow/issues"

[project.scripts]
httk-taskmanager = "httk.workflow.cli:main"
httk-v1-taskmanager = "httk.workflow.v1_cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "black",
  "ruff",
  "isort",
  "pyright",
  "mypy"
]
docs = [
  "sphinx",
  "furo",
  "myst-parser",
  "myst-nb",
  "sphinx-autodoc-typehints",
  "sphinx-copybutton",
  "sphinx-autoapi"
]
release = [
  "build>=1.2",
  "twine>=6.0",
]
# Importing CWL needs a CWL *parser*; executing what was imported does not, so
# this extra belongs on the machine that runs `httk workflow import cwl` and
# nowhere else. cwltool is deliberately absent: httk executes the normalized
# document on its own runner and manager, and never shells out to another engine.
# The Python Workflow Definition importer needs no extra at all — its documents
# are plain JSON, and the `python-workflow-definition` package is used as a
# stricter validator only when an environment happens to have it.
cwl = [
  "cwl-utils>=0.32,<1",
  "cwl-upgrader>=1.2,<2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
"httk.workflow" = [
  "py.typed",
  "v1_runtime/Execution/tasks/*.sh",
  "v1_runtime/Execution/tasks/vasp/*.sh",
  "v1_runtime/LICENSE",
  "v1_runtime/NOTICE",
  "v1_runtime/README.md",
  "v1_runtime/compat/*.sh",
  "shell/*.sh",
  "adapter_templates/*/computer.json",
  "adapter_templates/*/configure",
  "adapter_templates/*/install",
  "adapter_templates/*/invoke",
  "adapter_templates/*/push",
  "adapter_templates/*/pull",
  "adapter_templates/*/start-manager",
  "adapter_templates/*/status",
]
# The Python runners are modules of the package and ship with it; the Bash runner
# beside them is data, and a job referencing pkg:httk.workflow.runners/... needs it
# installed exactly like the shell libraries above.
"httk.workflow.runners" = [
  "*.sh",
]
# httk.workflow.integrations follows the same rule and needs no entry of its own:
# pwd_runner.py and cwl_runner.py are modules of that package, so a job
# referencing pkg:httk.workflow.integrations/... finds them wherever the package
# was installed. Nothing beside them is data.

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.isort]
profile = "black"

[tool.ruff]
target-version = "py312"
src = ["src", "examples", "tests"]

[tool.black]
target-version = ["py312"]
line-length = 120
skip-string-normalization = true

[tool.pyright]
pythonVersion = "3.12"
include = ["src", "examples", "tests"]
extraPaths = ["src", "../httk-core/src"]
reportMissingImports = true

[tool.mypy]
python_version = "3.12"
files = ["src", "examples", "tests"]
mypy_path = ["src"]
namespace_packages = true
explicit_package_bases = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["yaml", "markdown", "docutils", "docutils.*"]
ignore_missing_imports = true
