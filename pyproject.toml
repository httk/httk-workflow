[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "httk-workflow"
version = "0.2.0"
description = "Filesystem-native workflow execution for httk₂."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Rickard Armiento", email = "gitcommits@armiento.net" }]
dependencies = [
  # 2.1.0 is the release that adds httk.project (the project anchor and the
  # umbrella `httk project` command this package registers its extensions into).
  "httk-core>=2.1.0,<3",
]
keywords = [
  "Materials Discovery",
  "Materials Informatics",
  "Materials Science",
  "Machine Learning",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  # POSIX rather than OS Independent: the engine reaps process groups with
  # os.killpg, relies on POSIX rename and symlink semantics for its protocol,
  # and ships Bash authoring libraries it executes.
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Unix Shell",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: System :: Distributed Computing",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://httk.org"
Documentation = "https://docs.httk.org/httk-workflow/"
Repository = "https://github.com/httk/httk-workflow"
Issues = "https://github.com/httk/httk-workflow/issues"

[project.scripts]
httk-taskmanager = "httk.workflow.cli:main"
httk-v1-taskmanager = "httk.workflow.compat.v1.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "black",
  "ruff",
  "isort",
  "pyright",
  "mypy"
]
docs = [
  "sphinx",
  "furo",
  "myst-parser",
  "myst-nb",
  "sphinx-autodoc-typehints",
  "sphinx-copybutton",
  "sphinx-autoapi"
]
release = [
  "build>=1.2",
  "twine>=6.0",
]
default = []
# Importing CWL needs a CWL *parser*; executing what was imported does not, so
# this extra belongs on the machine that runs `httk workflow import cwl` and
# nowhere else. cwltool is deliberately absent: httk executes the normalized
# document on its own runner and manager, and never shells out to another engine.
# The Python Workflow Definition importer needs no extra at all — its documents
# are plain JSON, and the `python-workflow-definition` package is used as a
# stricter validator only when an environment happens to have it.
cwl = [
  "cwl-utils>=0.32,<1",
  "cwl-upgrader>=1.2,<2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
"httk.workflow" = [
  "py.typed",
  "shell/*.sh",
  "adapter_templates/*/remote.json",
  "adapter_templates/*/adapter",
]
# The bundled legacy shell runtime is data of the v1 compatibility package it now
# lives in, so a job whose httk-v1 backend points HTTK_DIR at it finds it wherever
# httk.workflow.compat.v1 was installed.
"httk.workflow.compat.v1" = [
  "v1_runtime/Execution/tasks/*.sh",
  "v1_runtime/Execution/tasks/vasp/*.sh",
  "v1_runtime/LICENSE",
  "v1_runtime/NOTICE",
  "v1_runtime/README.md",
  "v1_runtime/compat/*.sh",
]
# The Python runners are modules of the package and ship with it; the Bash runner
# beside them is data, and a job referencing pkg:httk.workflow.vasp.runners/...
# needs it installed exactly like the shell libraries above.
"httk.workflow.vasp.runners" = [
  "*.sh",
]
# httk.workflow.compat.cwl and httk.workflow.compat.pwd follow the same rule and
# need no entry of their own: cwl_runner.py and pwd_runner.py are modules of those
# packages, so a job referencing pkg:httk.workflow.compat.cwl/... or
# pkg:httk.workflow.compat.pwd/... finds them wherever the package was installed.
# Nothing beside them is data.

[tool.pytest.ini_options]
testpaths = ["tests"]
# The default run includes everything; `-m "not slow"` deselects the handful of
# tests that drive real subprocesses through timing-tolerant waits.
markers = [
  "slow: drives real processes and waits on them; deselect with -m 'not slow'",
]

[tool.isort]
profile = "black"

[tool.ruff]
target-version = "py312"
src = ["src", "examples", "tests"]

[tool.black]
target-version = ["py312"]
line-length = 120
skip-string-normalization = true

[tool.pyright]
pythonVersion = "3.12"
include = ["src", "examples", "tests"]
extraPaths = ["src", "../httk-core/src"]
reportMissingImports = true

[tool.mypy]
python_version = "3.12"
files = ["src", "examples", "tests"]
mypy_path = ["src"]
namespace_packages = true
explicit_package_bases = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["yaml", "markdown", "docutils", "docutils.*"]
ignore_missing_imports = true
