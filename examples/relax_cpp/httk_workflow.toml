[workflow]
id = "httk.vasp.relax-cpp"
description = "A minimal C++17 VASP relaxation runner."

[workflow.runner]
entry = "run"
steps = ["prepare", "run", "publish"]
initial_step = "prepare"
data_mode = "transactional"

[workflow.build]
command = "make"
platform = "uname -sm"
artifacts = ["relax", "*.o"]
